# Netlify Configuration for Intern Report Tracker Full-Stack Repository

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Production HTTP Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SPA Fallback - Directs all frontend routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
